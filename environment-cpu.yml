# ScanLag for users without an NVIDIA GPU (Windows, Linux, macOS on Apple silicon or Intel): the same
# as environment.yml, with the CPU-only build of PyTorch (no CUDA libraries, a much smaller download).
# The U-Net then runs on the CPU, several times slower; the classical detector and the analysis are
# not affected.
#
#     conda env create -f environment-cpu.yml
#     conda activate scanlag
#
# Keep the package list in step with environment.yml (tests/test_environment.py checks it).
name: scanlag
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - numpy
  - scipy
  - scikit-image
  - tifffile
  - imagecodecs
  - zarr>=3
  - pandas
  - pyarrow
  - pillow
  - matplotlib-base  # not matplotlib, which also installs PySide6 (Qt 6) next to PyQt5
  - tqdm
  - plotly
  # U-Net detector (fastremap: used by the image normalisation the U-Net shares with training).
  # pytorch-cpu makes conda pick the CPU build.
  - pytorch>=2.6
  - pytorch-cpu
  - torchvision
  - segmentation-models-pytorch>=0.5
  - fastremap
  # review window
  - napari>=0.5
  - pyqt=5
  - pip
  - pip:
      - -e .
