[project]
name = "scanlag"
version = "0.1.0"
description = "ScanLag colony appearance/growth analysis (successor of the MATLAB scan_lag code)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "opencv-python-headless",
    "tifffile",
    "imagecodecs",
    "zarr>=3",
    "pandas",
    "pyarrow",
    "pillow",
    "matplotlib",
    "tqdm",
    "plotly",
]

[project.optional-dependencies]
gui = ["napari[pyqt5]"]
dl = ["torch", "torchvision", "segmentation-models-pytorch>=0.5", "fastremap"]
cellpose = ["cellpose>=4"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scanlag*"]
